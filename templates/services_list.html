{% extends 'base.html' %}

{% block title %}Список услуг{% endblock %}

{% block content %}
<div class="content-section">
    <h1 class="page-title">Виды анализа</h1>

    <form action="{{ url_for('services_list') }}" method="get" class="search-form">
        <input type="text" name="query" class="search-input" placeholder="Поиск по наименованию..." value="{{ search_query }}">
        <button type="submit" class="btn">Найти</button>
    </form>

    <div class="services-grid">
        {% for service in services %}
        <div class="service-card">
            <a href="{{ url_for('service_detail', service_id=service.id) }}" class="service-card-link">
                <img src="{{ service.image_url if service.image_url else url_for('static', path='/images/services/placeholder.png') }}" alt="{{ service.title }}">
                <div class="card-body">
                    <h3>{{ service.title }}</h3>
                    <p class="price">{{ "%.2f"|format(service.price) }} руб.</p>
                </div>
            </a>
            <div class="card-footer">
                <form action="{{ url_for('add_to_cart', service_id=service.id) }}" method="post">
                    <button type="submit" class="btn">В заявку</button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
