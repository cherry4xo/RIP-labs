<!-- templates/analysis_list.html -->
{% extends 'base.html' %}

{% block title %}Виды анализа{% endblock %}

{% block content %}
<div class="content-section">
    <h1 class="page-title">Виды анализа</h1>
    <input type="text" class="search-input" placeholder="Поиск видов анализа...">

    <div class="analysis-list">
        {% for analysis in analyses %}
        <div class="analysis-list-item">
            <div class="item-info">
                <span class="card-tag">ANALYSIS</span>
                <h3>{{ analysis.title }}</h3>
                <p>{{ analysis.description }}</p>
            </div>
            <div class="item-actions">
                <a href="{{ url_for('analysis_detail', analysis_slug=analysis.slug) }}" class="card-link">Подробнее <span class="arrow">»</span></a>
                <a href="#" class="card-link">В корзину <span class="arrow">»</span></a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
