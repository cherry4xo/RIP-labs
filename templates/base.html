<!-- base.html -->
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Positive Tech Services{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <div class="background-overlay"></div>
    <div class="main-container">
        <header>
            <a href="{{ url_for('services_list') }}" class="home-link">
                <img src="{{ url_for('static', path='/logo.svg') }}" alt="Home" class="header-logo">
                <span>Positive Tech</span>
            </a>
            <!-- Иконка "домой" из вашего финального дизайна -->
            <a href="{{ url_for('services_list') }}" class="home-link">
                <img src="{{ url_for('static', path='/home.svg') }}" alt="Home" class="home-icon">
            </a>
        </header>
        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
